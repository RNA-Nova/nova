[project]
name = "nova"
version = "0.1.0"
description = "Nova monorepo workspace"
authors = [{ name = "Liujinming" }]
license = { text = "MIT" }
requires-python = ">=3.13,<3.14"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "win-64"]

[tool.pixi.dependencies]
python = ">=3.13,<3.14"

[tool.pixi.pypi-dependencies]
nova-ai = { path = "packages/nova_ai", editable = true }
nova-agent = { path = "packages/nova_agent", editable = true }
nova-async = { path = "packages/nova_async", editable = true }
nova-catalog = { path = "packages/nova_catalog", editable = true }
nova-harness = { path = "packages/nova_harness", editable = true }
nova-server = { path = "packages/nova_server", editable = true }
nova-protocol = { path = "packages/nova_protocol", editable = true }
nova-coding-agent = { path = "bundles/nova_coding_agent", editable = true }
nova-exec-server-client = { path = "packages/nova-exec-server-client", editable = true }
websockets = ">=12.0"
# 上限钉在 <3.10.0：3.10.0（2026-09-08）引入流式收尾回归——
# PoolByteStream 生成器在 athrow 后无法停止，即使显式关流+关客户端也压不住
# "generator didn't stop after athrow()" 噪音；3.9.0 及之前干净。上游修复后放开。
openai = ">=2.0,<3.10.0"
httpx = ">=0.27.0"
anthropic = ">=1.0"
# 取消作用域（CancelScope——请求/消费段的真杀执行层；>=4.11 归因与
# uncancel 簿记修正），词汇层仍是自家 AbortSignal（TS 对齐）
anyio = ">=4.11"
pydantic = ">=2.0"
json-repair = ">=0.58.4"
jsonschema = ">=4.0"
pyyaml = ">=6.0.1"
filelock = ">=3.24.3"
tomli = ">=2.0.1"
uuid6 = ">=2024.7.10"
setuptools = "*"
pathspec = ">=0.12.1"
pillow = ">=10.0"

[tool.pixi.feature.dev.pypi-dependencies]
black = ">=23.10.1"
isort = ">=5.12.0,<6"
pre-commit = ">=3.5.0"
pyright = ">=1.1.400"
pytest = ">=7.4.0"
pytest-asyncio = ">=1.3"
pytest-timeout = ">=2.3.1"
pytest-socket = ">=0.7.0"
respx = ">=0.22.0"
hypothesis = ">=6.100.0"
sniffio = ">=1.3.0"

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
# 生成物由 nova-catalog 管线产出，格式以生成器为准——排除出 isort
extend_skip = [
    "packages/nova_ai/src/nova_ai/models_generated.py",
    "packages/nova_ai/src/nova_ai/providers/data",
    "packages/nova_ai/src/nova_ai/providers/anthropic/models.py",
    "packages/nova_ai/src/nova_ai/providers/kimi_coding/models.py",
    "packages/nova_ai/src/nova_ai/providers/moonshotai/models.py",
    "packages/nova_ai/src/nova_ai/providers/moonshotai_cn/models.py",
    "packages/nova_ai/src/nova_ai/providers/volcengine/models.py",
]

[tool.pixi.environments]
default = { features = [], solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[tool.pixi.tasks]
test-ai = { cmd = "pytest tests -m 'not integration'", cwd = "packages/nova_ai" }
test-agent = { cmd = "pytest tests -m 'not integration'", cwd = "packages/nova_agent" }
test-async = { cmd = "pytest tests", cwd = "packages/nova_async" }
test-catalog = { cmd = "pytest tests", cwd = "packages/nova_catalog" }
test-harness = { cmd = "pytest tests -m 'not integration'", cwd = "packages/nova_harness" }
test-server = { cmd = "pytest tests -m 'not integration'", cwd = "packages/nova_server" }
test-protocol = { cmd = "pytest tests", cwd = "packages/nova_protocol" }
test-executor-client = { cmd = "pytest tests -m 'not integration'", cwd = "packages/nova-exec-server-client" }
test-coding = { cmd = "pytest tests", cwd = "bundles/nova_coding_agent/backend" }
test-all = { depends-on = ["test-ai", "test-agent", "test-async", "test-catalog", "test-harness", "test-server", "test-protocol", "test-executor-client", "test-coding"] }
generate-models = { cmd = "python packages/nova_catalog/scripts/generate.py" }
check-model-data = { cmd = "python packages/nova_catalog/scripts/check_model_data.py" }
check-live = { cmd = "python ../nova_catalog/scripts/check_live_providers.py", cwd = "packages/nova_ai" }
test-integration = { cmd = "pytest tests/integration", cwd = "packages/nova_ai" }
format = "black packages/nova_protocol/src packages/nova_ai/src packages/nova_agent/src packages/nova_harness/src packages/nova_server/src packages/nova-exec-server-client/src bundles/nova_coding_agent/backend && isort packages/nova_protocol/src packages/nova_ai/src packages/nova_agent/src packages/nova_harness/src packages/nova_server/src packages/nova-exec-server-client/src bundles/nova_coding_agent/backend"
typecheck = "pyright packages/nova_protocol/src/nova_protocol packages/nova_ai/src/nova_ai packages/nova_agent/src/nova_agent"
