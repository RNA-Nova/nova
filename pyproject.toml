[project]
name = "nova"
version = "0.1.0"
description = "Nova monorepo workspace"
authors = [{ name = "Liujinming" }]
license = { text = "MIT" }
requires-python = ">=3.12,<3.14"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "win-64"]

[tool.pixi.dependencies]
python = ">=3.12,<3.14"

[tool.pixi.pypi-dependencies]
nova-ai = { path = "packages/nova_ai", editable = true }
nova-agent = { path = "packages/nova_agent", editable = true }
nova-harness = { path = "packages/nova_harness", editable = true }
nova-server = { path = "packages/nova_server", editable = true }
nova-coding-agent = { path = "bundles/nova_coding_agent", editable = true }
nova-executor-client = { path = "packages/nova-executor-client", editable = true }
websockets = ">=12.0"
openai = ">=2.0"
httpx = ">=0.27.0"
pydantic = ">=2.0"
json-repair = ">=0.58.4"
jsonschema = ">=4.0"
pyyaml = ">=6.0.1"
filelock = ">=3.24.3"
tomli = ">=2.0.1"
uuid6 = ">=2024.7.10"
setuptools = "*"
pathspec = ">=0.12.1"
pillow = ">=10.0"

[tool.pixi.feature.dev.pypi-dependencies]
black = ">=23.10.1"
isort = ">=5.12.0"
pre-commit = ">=3.5.0"
pyright = ">=1.1.400"
pytest = ">=7.4.0"
pytest-asyncio = ">=0.21.0"
sniffio = ">=1.3.0"

[tool.pixi.environments]
default = { features = [], solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[tool.pixi.tasks]
test-ai = { cmd = "pytest tests -m 'not integration'", cwd = "packages/nova_ai" }
test-agent = { cmd = "pytest tests -m 'not integration'", cwd = "packages/nova_agent" }
test-harness = { cmd = "pytest tests -m 'not integration'", cwd = "packages/nova_harness" }
test-server = { cmd = "pytest tests -m 'not integration'", cwd = "packages/nova_server" }
test-coding = { cmd = "pytest tests", cwd = "bundles/nova_coding_agent/backend" }
test-all = { cmd = "pytest tests -m 'not integration'", depends-on = ["test-ai", "test-agent", "test-harness", "test-server", "test-coding"] }
generate-models = { cmd = "python scripts/generate_models.py", cwd = "packages/nova_ai" }
check-model-data = { cmd = "python scripts/check_model_data.py", cwd = "packages/nova_ai" }
format = "black packages/nova_ai/src packages/nova_agent/src packages/nova_harness/src bundles/nova_coding_agent/backend && isort packages/nova_ai/src packages/nova_agent/src packages/nova_harness/src bundles/nova_coding_agent/backend"
typecheck = "pyright packages/nova_ai/src/nova_ai packages/nova_agent/src/nova_agent"
nova = "nova-harness run"
