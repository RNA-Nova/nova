[project]
name = "nova"
version = "0.1.0"
description = "Nova monorepo workspace"
authors = [{ name = "Liujinming" }]
license = { text = "MIT" }
requires-python = ">=3.9,<3.13"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "win-64"]

[tool.pixi.dependencies]
python = ">=3.9,<3.13"

[tool.pixi.pypi-dependencies]
nova-ai = { path = "packages/nova_ai", editable = true }
nova-agent = { path = "packages/nova_agent", editable = true }
nova-harness = { path = "packages/nova_harness", editable = true }
nova-coding-agent = { path = "packages/nova_coding_agent", editable = true }
openai = ">=1.109.1"
pydantic = ">=2.0"
json-repair = ">=0.58.4"
jsonschema = ">=4.0"
pyyaml = ">=6.0.1"
filelock = ">=3.24.3"
tomli = ">=2.0.1"
setuptools = "*"
pathspec = ">=0.12.1"

[tool.pixi.feature.dev.pypi-dependencies]
black = ">=23.10.1"
isort = ">=5.12.0"
pre-commit = ">=3.5.0"
pytest = ">=7.4.0"
pytest-asyncio = ">=0.21.0"
sniffio = ">=1.3.0"

[tool.pixi.environments]
default = { features = [], solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[tool.pixi.tasks]
test-ai = { cmd = "pytest tests -m 'not integration'", cwd = "packages/nova_ai" }
test-agent = { cmd = "pytest tests -m 'not integration'", cwd = "packages/nova_agent" }
test-harness = { cmd = "pytest tests -m 'not integration'", cwd = "packages/nova_harness" }
test-coding = { cmd = "pytest tests", cwd = "packages/nova_coding_agent" }
test-all = { cmd = "pytest tests -m 'not integration'", depends-on = ["test-ai", "test-agent", "test-harness", "test-coding"] }
format = "black packages/nova_ai/src packages/nova_agent/src packages/nova_harness/src packages/nova_coding_agent/src packages/nova_coding_agent/tools && isort packages/nova_ai/src packages/nova_agent/src packages/nova_harness/src packages/nova_coding_agent/src packages/nova_coding_agent/tools"
nova = "nova-harness run"
