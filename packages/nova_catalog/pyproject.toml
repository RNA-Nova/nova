[tool.poetry]
name = "nova-catalog"
version = "0.1.0"
description = "Nova 模型目录知识、数据源与生成管线。"
authors = ["Liujinming"]
readme = "README.md"
license = "MIT"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
packages = [
    { include = "nova_catalog", from = "src" },
]

[tool.poetry.dependencies]
python = ">=3.13,<3.14"
httpx = ">=0.27.0"
# 兄弟包 nova-protocol 按仓库约定不在此声明 path 依赖，
# 统一由根 pyproject.toml 的 [tool.pixi.pypi-dependencies] editable 安装。

[tool.poetry.group.dev.dependencies]
black = "^23.10.1"
isort = "^5.12.0"
pytest = ">=8.2"
pytest-asyncio = ">=1.3"
pytest-timeout = ">=2.3.1"
pytest-socket = ">=0.7.0"
respx = ">=0.22.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
target-version = ["py313"]

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true

[tool.pytest.ini_options]
asyncio_mode = "strict"
timeout = 30
addopts = "--disable-socket --allow-unix-socket"
markers = [
    "enable_socket: marks tests that may use the network (pytest-socket carve-out)",
]
