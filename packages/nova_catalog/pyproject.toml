[tool.poetry]
name = "nova-catalog"
version = "0.1.0"
description = "Nova 模型目录构建管线——知识（providers/）+ 族事实（families/）+ 薄拉取（sources/）+ 引擎（build）+ 校验（model_data）。对位 pi packages/ai/catalog，自包含构建期世界，不依赖 nova_ai 运行时。"
authors = ["Liujinming"]
readme = "README.md"
license = "MIT"
keywords = ["llm", "agent", "model-catalog", "pipeline"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]

packages = [
    { include = "nova_catalog", from = "src" },
]

[tool.poetry.dependencies]
python = ">=3.13,<3.14"
httpx = ">=0.27"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = ">=0.21.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
