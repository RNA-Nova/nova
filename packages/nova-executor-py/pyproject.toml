[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nova-executor"
version = "0.1.0"
description = "Python SDK for nova-executor remote execution service"
authors = [{ name = "Liujinming" }]
license = { text = "MIT" }
requires-python = ">=3.12,<3.14"
dependencies = [
    "websockets>=12.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nova_executor"]
