[tool.poetry]
name = "nova-harness"
version = "0.1.0"
description = "基于 nova_ai + pi_agent 构建的高阶 Agent SDK，提供会话管理、上下文压缩和资源加载。"
authors = ["Liujinming"]
readme = "README.md"
license = "MIT"
keywords = ["agent", "session", "harness", "llm", "sdk", "compaction"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

packages = [
    { include = "nova_harness", from = "src" },
]

[tool.poetry.dependencies]
python = ">=3.9,<3.13"
setuptools = "*"
mashumaro = ">=3.20"
json-repair = ">=0.58.4"
pyyaml = "^6.0.1"
filelock = "^3.24.3"

[tool.poetry.group.dev.dependencies]
black = "^23.10.1"
isort = "^5.12.0"
pre-commit = "^3.5.0"
pytest = "^7.4.0"
sniffio = "^1.3.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
target-version = ['py311']

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
