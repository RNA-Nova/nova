[workspace]
resolver = "2"
members = [
    "crates/exec-server-protocol",
    "crates/exec-server",
    "crates/exec-server-cli",
    "crates/exec-server-protocol-core",
    "crates/exec-server-file-system",
    "crates/exec-server-network-proxy",
    "crates/exec-server-shell-command",
    "crates/exec-server-utils-absolute-path",
    "crates/exec-server-utils-path-uri",
    "crates/exec-server-utils-home-dir",
    "crates/exec-server-utils-rustls-provider",
    "crates/exec-server-http-client",
    "crates/exec-server-utils-string",
    "crates/exec-server-utils-cargo-bin",
    "crates/exec-server-utils-pty",
    "crates/exec-server-sandboxing",
    "crates/exec-server-windows-sandbox",
    "crates/exec-server-otel",
    "crates/exec-server-websocket-client",
    "crates/exec-server-linux-sandbox",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/RNA-Nova/nova"

[workspace.dependencies]
# 内部依赖
nova-exec-server-protocol = { path = "crates/exec-server-protocol" }
nova-exec-server = { path = "crates/exec-server" }
nova-exec-server-protocol-core = { path = "crates/exec-server-protocol-core" }
nova-exec-server-file-system = { path = "crates/exec-server-file-system" }
nova-exec-server-network-proxy = { path = "crates/exec-server-network-proxy" }
nova-exec-server-shell-command = { path = "crates/exec-server-shell-command" }
nova-exec-server-utils-absolute-path = { path = "crates/exec-server-utils-absolute-path" }
nova-exec-server-utils-path-uri = { path = "crates/exec-server-utils-path-uri" }
nova-exec-server-utils-home-dir = { path = "crates/exec-server-utils-home-dir" }
nova-exec-server-utils-rustls-provider = { path = "crates/exec-server-utils-rustls-provider" }
nova-exec-server-http-client = { path = "crates/exec-server-http-client" }
nova-exec-server-utils-string = { path = "crates/exec-server-utils-string" }
nova-exec-server-utils-cargo-bin = { path = "crates/exec-server-utils-cargo-bin" }
nova-exec-server-utils-pty = { path = "crates/exec-server-utils-pty" }
nova-exec-server-sandboxing = { path = "crates/exec-server-sandboxing" }
nova-exec-server-windows-sandbox = { path = "crates/exec-server-windows-sandbox" }
nova-exec-server-otel = { path = "crates/exec-server-otel" }
nova-exec-server-websocket-client = { path = "crates/exec-server-websocket-client" }
nova-exec-server-linux-sandbox = { path = "crates/exec-server-linux-sandbox" }

# 基础
anyhow = "1"
arc-swap = "1.9.0"
base64 = "0.22.1"
bytes = "1.10.1"
dirs = "6"
dunce = "1.0.4"
futures = { version = "0.3", default-features = false }
gethostname = "1.1.0"
once_cell = "1.20.2"
serde = { version = "1", features = ["rc"] }
serde_json = "1"
thiserror = "2.0.17"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7.18", features = ["io", "rt"] }
tracing = "0.1.44"
url = "2"
uuid = "1"

# JSON-RPC / HTTP
http = "1.3.1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws"] }
tokio-tungstenite = { version = "0.28.0", features = [
    "proxy",
    "rustls-tls-native-roots",
] }

# rama 网络栈（network-proxy 移植自 codex-network-proxy，版本与其 pin 保持一致）
rama-core = "=0.3.0-alpha.4"
rama-http = "=0.3.0-alpha.4"
rama-http-backend = { version = "=0.3.0-alpha.4", features = ["tls"] }
rama-net = { version = "=0.3.0-alpha.4", features = ["http", "tls"] }
rama-socks5 = "=0.3.0-alpha.4"
rama-tcp = { version = "=0.3.0-alpha.4", features = ["http"] }
rama-tls-rustls = { version = "=0.3.0-alpha.4", features = ["http"] }
rama-unix = "=0.3.0-alpha.4"

# 进程与 PTY
portable-pty = "0.9.0"

# 路径与 URI
schemars = "0.8.22"
ts-rs = "11"
urlencoding = "2.1"

# 时间
chrono = "0.4.43"

# 加密与安全
rustls = { version = "0.23", default-features = false, features = [
    "aws_lc_rs",
    "std",
] }
rustls-native-certs = "0.8.3"
rustls-pki-types = "1.14.0"
sha1 = "0.10.6"
sha2 = "0.10"

# 命令行
clap = "4"

# 测试
pretty_assertions = "1.4.1"
tempfile = "3.23.0"

# 其他外部依赖
assert_cmd = "2"
chardetng = "0.1.17"
encoding_rs = "0.8.35"
globset = "0.4"
icu_decimal = "2.1"
icu_locale_core = "2.1"
icu_provider = { version = "2.1", features = ["sync"] }
image = { version = "^0.25.9", default-features = false }
landlock = "0.4.4"
libc = "0.2.182"
lru = "0.16.3"
mime_guess = "2.0.5"
multimap = "0.10.0"
quick-xml = "0.41.0"
rand = "0.9"
rcgen = { version = "0.14.7", default-features = false, features = [
    "aws_lc_rs",
    "pem",
] }
regex = "1.12.3"
regex-lite = "0.1.8"
reqwest = { version = "0.12", features = ["cookies"] }
rustix = { version = "1.1.4", features = ["net"] }
seccompiler = "0.5.0"
serde_with = "3.17"
shlex = "1.3.0"
starlark = { version = "0.14.2", default-features = false }
strum = "0.27.2"
strum_macros = "0.28.0"
sys-locale = "0.3.2"
system-configuration = "0.7"
time = "0.3.47"
tokio-rustls = "0.26.4"
which = "8"
wildmatch = "2.6.1"
zstd = "0.13"

# 测试专用
ctor = "0.6.3"
divan = "0.1.21"
lazy_static = "1"
log = "0.4"
maplit = "1.0.2"
serial_test = "3.2.0"
wiremock = "0.6"

# 更多外部依赖
assert_matches = "1.5.0"
async-channel = "2.3.1"
dns-lookup = "3.0.1"
gix = { version = "0.81.0", default-features = false, features = ["sha1"] }
similar = "2.7.0"
walkdir = "2.5.0"
eventsource-stream = "0.2.3"
indexmap = "2.12.0"
opentelemetry-appender-tracing = "0.31.0"
opentelemetry-otlp = "0.32.0"
opentelemetry-semantic-conventions = "0.31.0"
os_info = "3.12.0"
serde_ignored = "0.1.14"
serde_path_to_error = "0.1.20"
tokio-stream = "0.1.18"
tokio-test = "0.4"
toml = "0.9.5"
toml_edit = "0.24.0"
tonic = { version = "0.14.3", default-features = false, features = ["channel", "codegen"] }
tonic-prost = "0.14.3"
tungstenite = { version = "0.27.0", features = ["deflate", "proxy"] }
winapi-util = "0.1.11"

# Bazel runfiles（用于测试定位资源）
runfiles = { git = "https://github.com/dzbarsky/rules_rust", rev = "b56cbaa8465e74127f1ea216f813cd377295ad81" }

# OpenTelemetry（可选）
opentelemetry = "0.31.0"
opentelemetry_sdk = "0.31.0"
tracing-opentelemetry = "0.32.0"
tracing-subscriber = "0.3.22"

# 使用 Codex 的 fork 以支持 proxy feature
[patch.crates-io]
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }

[patch."ssh://git@github.com/openai-oss-forks/tungstenite-rs.git"]
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }
