[package]
name = "nova-exec-server-sandboxing"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
name = "nova_exec_server_sandboxing"
path = "src/lib.rs"
doctest = false

[dependencies]
anyhow = { workspace = true }
nova-exec-server-network-proxy = { path = "../exec-server-network-proxy" }
nova-exec-server-protocol-core = { path = "../exec-server-protocol-core" }
nova-exec-server-utils-absolute-path = { path = "../exec-server-utils-absolute-path" }
nova-exec-server-utils-path-uri = { path = "../exec-server-utils-path-uri" }
nova-exec-server-utils-pty = { path = "../exec-server-utils-pty" }
nova-exec-server-windows-sandbox = { path = "../exec-server-windows-sandbox" }
dunce = { workspace = true }
libc = { workspace = true }
serde_json = { workspace = true }
regex-lite = { workspace = true }
tracing = { workspace = true, features = ["log"] }
url = { workspace = true }
which = { workspace = true }

[target.'cfg(windows)'.dependencies]
nova-exec-server-utils-home-dir = { path = "../exec-server-utils-home-dir" }

[dev-dependencies]
anyhow = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
