[package]
name = "nova-exec-server-linux-sandbox"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
name = "nova_exec_server_linux_sandbox"
path = "src/lib.rs"
doctest = false

# 二进制名 nova-linux-sandbox：argv0 互操作契约（executor-sandboxing 的
# NOVA_EXEC_SERVER_LINUX_SANDBOX_ARG0 按此名字自我 re-exec）。
[[bin]]
name = "nova-linux-sandbox"
path = "src/main.rs"

# 实现为 Linux-only（bubblewrap + landlock + seccomp），依赖全部按 target
# 门控；其他平台只编译 stub `run_main`。
[target.'cfg(target_os = "linux")'.dependencies]
clap = { workspace = true, features = ["derive"] }
globset = { workspace = true }
landlock = { workspace = true }
libc = { workspace = true }
nova-exec-server-network-proxy = { path = "../exec-server-network-proxy" }
nova-exec-server-protocol-core = { path = "../exec-server-protocol-core" }
nova-exec-server-sandboxing = { path = "../exec-server-sandboxing" }
nova-exec-server-utils-absolute-path = { path = "../exec-server-utils-absolute-path" }
rustix = { workspace = true }
seccompiler = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
url = { workspace = true }

[target.'cfg(target_os = "linux")'.dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
test-case = "3.3.1"
# landlock/managed-proxy 集成套件的测试驱动依赖（移植自 codex 套件）
nova-exec-server-utils-path-uri = { path = "../exec-server-utils-path-uri" }
tokio = { workspace = true, features = ["macros", "process", "rt-multi-thread", "time"] }
