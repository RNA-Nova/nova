[package]
name = "nova-exec-server-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "nova-exec-server"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
url = { workspace = true }
nova-exec-server = { workspace = true }
nova-exec-server-http-client = { workspace = true }
nova-exec-server-otel = { workspace = true }
nova-exec-server-sandboxing = { workspace = true }
nova-exec-server-utils-home-dir = { workspace = true }
nova-exec-server-utils-pty = { workspace = true }
nova-exec-server-websocket-auth = { workspace = true }

# Linux 沙箱 helper 内嵌（argv0 basename 分派自分身，对位 codex arg0 形态）
[target.'cfg(target_os = "linux")'.dependencies]
nova-exec-server-linux-sandbox = { workspace = true }
tempfile = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
