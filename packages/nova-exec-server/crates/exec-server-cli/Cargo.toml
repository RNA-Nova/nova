[package]
name = "nova-exec-server-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "nova-exec-server"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
nova-exec-server = { workspace = true }
nova-exec-server-http-client = { workspace = true }
nova-exec-server-otel = { workspace = true }
nova-exec-server-sandboxing = { workspace = true }
nova-exec-server-utils-home-dir = { workspace = true }
nova-exec-server-utils-pty = { workspace = true }
nova-exec-server-websocket-auth = { workspace = true }

# Linux 沙箱 helper 内嵌（argv0 basename 分派自分身，对位 codex arg0 形态）
[target.'cfg(target_os = "linux")'.dependencies]
nova-exec-server-linux-sandbox = { workspace = true }
tempfile = { workspace = true }

# Windows 沙箱包装器分派（--run-as-windows-sandbox，对位 codex arg0）
[target.'cfg(target_os = "windows")'.dependencies]
nova-exec-server-windows-sandbox = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
# CLI e2e（tests/ 对位 codex cli/tests 适配组）
anyhow = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
jsonwebtoken = { workspace = true }
nova-exec-server-utils-cargo-bin = { workspace = true }
sha2 = { workspace = true }
tokio-tungstenite = { workspace = true }
url = { workspace = true }
wiremock = { workspace = true }

[target.'cfg(unix)'.dev-dependencies]
libc = { workspace = true }
