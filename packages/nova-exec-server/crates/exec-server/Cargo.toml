[package]
name = "nova-exec-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
name = "nova_exec_server"
path = "src/lib.rs"
doctest = false

[dependencies]
anyhow = { workspace = true }
toml = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
gethostname = { workspace = true }
http = { workspace = true }
# 对位 codex 39f4277087：进程遥测面的 SpanContext/launch_context（原仅 dev 依赖）
opentelemetry = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# 对位 codex 39f4277087 build-info build_id：provider_id 的 SHA-256 派生
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
nova-exec-server-protocol = { workspace = true }
nova-exec-server-file-system = { workspace = true }
nova-exec-server-sandboxing = { workspace = true }
nova-exec-server-utils-absolute-path = { workspace = true }
nova-exec-server-utils-path-uri = { workspace = true }
nova-exec-server-utils-pty = { workspace = true }
nova-exec-server-protocol-core = { workspace = true }
nova-exec-server-network-proxy = { workspace = true }
nova-exec-server-utils-home-dir = { workspace = true }
nova-exec-server-utils-rustls-provider = { workspace = true }
nova-exec-server-http-client = { workspace = true }
nova-exec-server-websocket-auth = { workspace = true }
nova-exec-server-websocket-client = { workspace = true }
nova-exec-server-otel = { workspace = true }
nova-exec-server-shell-command = { workspace = true }

# WebSocket server
axum = { workspace = true }
tokio-tungstenite = { workspace = true }

# TLS / 安全
rustls = { workspace = true }

arc-swap = { workspace = true }

# 对位 codex d9960e12bb：bubblewrap 完整性后端（bundled bwrap 清点 + deny glob 快照）
[target.'cfg(target_os = "linux")'.dependencies]
nova-exec-server-linux-sandbox = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
# 沙箱开门 fd 传递：SCM_RIGHTS 收发（net）与 CLOEXEC 设置（fs）
rustix = { version = "1.1.4", features = ["net", "fs"] }
# 对位 codex 39f4277087：shell snapshot 文件回放的 daemon 目录临时载体
# （dev-dependencies 仍保留 tempfile 供非 unix 测试目标使用）
tempfile = { workspace = true }

[target.'cfg(windows)'.dependencies]
# 对位 codex 3342ee8c07：MXC 完整性后端（依赖清点 + 策略准备）
nova-exec-server-mxc-sandbox = { workspace = true }
# 对位 codex codex-utils-process：background_command（CREATE_NO_WINDOW）对位物在该 crate
nova-exec-server-windows-sandbox = { workspace = true }
which = { workspace = true }
# 对位 codex 39f4277087 workspace 钉版（windows-sys = "0.61.2"）：与 mxc-sandbox 统一
# 0.61——HANDLE 为指针类型，OBJ_CASE_INSENSITIVE/OBJ_DONT_REPARSE 迁至 Win32::Foundation，
# SECURITY_QUALITY_OF_SERVICE.EffectiveOnly / FILE_DISPOSITION_INFO.DeleteFile 为 bool。
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    # no_follow 原语：SECURITY_QUALITY_OF_SERVICE / SecurityIdentification
    "Win32_Security",
    "Win32_Storage_FileSystem",
    # no_follow 原语：IO_STATUS_BLOCK
    "Win32_System_IO",
    # no_follow windows 测试：CreateNamedPipeW
    "Win32_System_Pipes",
    # 沙箱开门句柄复制：OpenProcess / GetCurrentProcess / DuplicateHandle
    "Win32_System_Threading",
] }

[dev-dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
ctor = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
serial_test = { workspace = true }
test-case = "3.3.1"
tokio = { workspace = true, features = ["test-util"] }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
wiremock = { workspace = true }
nova-exec-server-network-proxy = { workspace = true }
# 对位 codex 39f4277087 exec-server dev-dependencies：shell snapshot 测试的
# profile-bin/wc 包装器写入（write_executable）需要全平台可用
nova-exec-server-utils-cargo-bin = { workspace = true }

[target.'cfg(target_os = "linux")'.dev-dependencies]
# 集成测试的 argv0 重入分派：landlock/bwrap 沙箱以 `nova-linux-sandbox`
# 为 argv0 重入测试二进制，需要真正的 linux sandbox 入口（见 tests/common/mod.rs）
nova-exec-server-linux-sandbox = { workspace = true }
# pid_namespace e2e 直起真实 nova-exec-server / nova-linux-sandbox 二进制
# （对位 codex pid_namespace_tests 对 codex-utils-cargo-bin 的依赖）
nova-exec-server-utils-cargo-bin = { workspace = true }

[target.'cfg(windows)'.dev-dependencies]
nova-exec-server-windows-sandbox = { workspace = true }
# windows 测试装配沙箱 helper（对位 codex exec-server 对 codex-utils-cargo-bin 的依赖）
nova-exec-server-utils-cargo-bin = { workspace = true }
