[package]
edition.workspace = true
license.workspace = true
name = "nova-exec-server-http-client"
version = "0.1.0"

[dependencies]
bytes = { workspace = true }
nova-exec-server-utils-rustls-provider = { path = "../exec-server-utils-rustls-provider"  }
futures = { workspace = true }
http = { workspace = true }
# 对位 codex 39f4277087 codex-rs/http-client/Cargo.toml：response.rs 的 PolicyBody
# 需要 http_body trait；failure_class() 需要 native_tls::Error 下行识别。
http-body = "1.0.1"
httpdate = { workspace = true }
native-tls = "0.2"
opentelemetry = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls-tls-native-roots", "stream"] }
rustls = { workspace = true }
rustls-native-certs = { workspace = true }
rustls-pki-types = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# request_builder.rs 的 query() 序列化（对位锚点同名单依赖）。
serde_urlencoded = "0.7"
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "time", "sync"] }
tracing = { workspace = true }
tracing-opentelemetry = { workspace = true }
zstd = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
system-configuration = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Networking_WinHttp",
] }



[dev-dependencies]
nova-exec-server-utils-cargo-bin = { path = "../exec-server-utils-cargo-bin"  }
opentelemetry_sdk = { workspace = true }
pretty_assertions = { workspace = true }
rcgen = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber = { workspace = true }

[lib]
doctest = false
