[package]
name = "nova-exec-server-network-proxy"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
name = "nova_exec_server_network_proxy"
path = "src/lib.rs"
doctest = false

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true, features = ["derive"] }
# 对位 codex 529cd6b860：域名匹配已换 DomainPatternSet；上游保留 globset 仅为
# mitm_hook.rs（nova 未镜像），故此处移除该依赖。
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }
nova-exec-server-utils-absolute-path = { workspace = true }
nova-exec-server-utils-rustls-provider = { workspace = true }
rama-core = { workspace = true }
rama-http = { workspace = true }
rama-http-backend = { workspace = true }
rama-net = { workspace = true }
rama-socks5 = { workspace = true }
rama-tcp = { workspace = true }
rama-tls-rustls = { workspace = true }

[target.'cfg(target_family = "unix")'.dependencies]
rama-unix = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.52"
features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
]

[target.'cfg(windows)'.dev-dependencies]
nova-exec-server-windows-sandbox = { workspace = true }
