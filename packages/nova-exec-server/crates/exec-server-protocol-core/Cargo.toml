[package]
edition.workspace = true
license.workspace = true
name = "nova-exec-server-protocol-core"
version = "0.1.0"

[lib]
name = "nova_exec_server_protocol_core"
path = "src/lib.rs"
doctest = false



[dependencies]
chardetng = { workspace = true }
nova-exec-server-network-proxy = { path = "../exec-server-network-proxy"  }
nova-exec-server-utils-absolute-path = { path = "../exec-server-utils-absolute-path"  }
nova-exec-server-utils-path-uri = { path = "../exec-server-utils-path-uri"  }
encoding_rs = { workspace = true }
globset = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
strum = { workspace = true }
strum_macros = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
ts-rs = { workspace = true, features = [
    "uuid-impl",
    "serde-json-impl",
    "no-serde-warnings",
] }
wildmatch = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
landlock = { workspace = true }
seccompiler = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }

[package.metadata.cargo-shear]
# Required because:
# `strum`: is referenced by generated `EnumIter` derive implementations
ignored = ["strum"]
