[package]
edition.workspace = true
license.workspace = true
name = "nova-exec-server-utils-pty"
version = "0.1.0"

[dependencies]
anyhow = { workspace = true }
portable-pty = { workspace = true }
# 对位 codex origin/main（spawn 管线批）：signal 供 posix_child 的 SIGCHLD 订阅
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }

[dev-dependencies]
# 对位 codex origin/main（spawn 管线批）：对位上游 dev-deps（cargo-bin fixture/ctor/tempfile）
nova-exec-server-utils-cargo-bin = { workspace = true }
ctor = { workspace = true }
tempfile = { workspace = true }
pretty_assertions = { workspace = true }

[target.'cfg(windows)'.dependencies]
filedescriptor = "0.8.3"
lazy_static = { workspace = true }
log = { workspace = true }
shared_library = "0.1.9"
winapi = { version = "0.3.9", features = [
    "handleapi",
    "jobapi",
    "jobapi2",
    "libloaderapi",
    "minwinbase",
    "processthreadsapi",
    # "std" 为 nova 自增（上游无此项）：实证必需——摘掉后 windows-gnu 交叉
    # 编译报 3 错（winapi std 特性提供我们使用的 std 链接辅助）。
    "std",
    "synchapi",
    "winbase",
    "wincon",
    "winerror",
    "winnt",
] }
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[lib]
doctest = false
