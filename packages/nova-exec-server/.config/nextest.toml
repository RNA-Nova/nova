# 改编自 codex-rs/.config/nextest.toml（追平批次同步），裁掉引用本工作区
# 不存在包（codex-app-server* / codex-core 等）的 override——nextest 的
# package() 算子会对未知包拒绝解析。
[profile.default]
# Retry once so one transient failure does not fail full-CI outright.
# Fanout keeps the full-CI shards moving without treating every >30s test as
# stuck. Keep this aligned with the broader timeout budget we give sharded CI.
slow-timeout = { period = "30s", terminate-after = 2 }
retries = 1

[profile.default.junit]
path = "junit.xml"

[profile.local]
inherits = "default"

[test-groups.windows_sandbox_legacy_sessions]
max-threads = 1

# 对位 codex 9212b3eca8：共享 runner 提升沙箱账户的用例单线程排队
[test-groups.windows_sandbox_accounts]
max-threads = 1

[test-groups.windows_process_heavy]
max-threads = 2

[[profile.default.overrides]]
# 这些用例共享 runner 的提升沙箱账户（并发 setup 会在他方 setup 与 logon 之间
# 轮换账户密码）。入组单线程排队（超时计时也因此推迟）；跨进程仍由
# WindowsSandboxAccountTestGuard 文件锁协调（对位 codex 9212b3eca8）。
platform = 'cfg(windows)'
filter = '''
    (package(nova-exec-server) & test(file_system_elevated_relative_read_denial_uses_policy_cwd)) |
    (package(nova-exec-server-windows-sandbox) & test(elevated_non_tty_cmd_forwards_env_output_and_exit))
'''
test-group = 'windows_sandbox_accounts'

[[profile.default.overrides]]
# These tests create restricted-token Windows child processes and private desktops.
# Serialize them to avoid exhausting Windows session/global desktop resources in CI.
filter = 'package(nova-exec-server-windows-sandbox) & test(legacy_)'
test-group = 'windows_sandbox_legacy_sessions'

[[profile.default.overrides]]
# Windows-heavy tests spawn subprocesses, session files, or JSON-RPC
# clients and have been the dominant source of 30s full-CI timeouts.
platform = 'cfg(windows)'
filter = 'test(connect_stdio_command_initializes_json_rpc_client_on_windows)'
test-group = 'windows_process_heavy'
slow-timeout = { period = "45s", terminate-after = 2 }

[[profile.default.overrides]]
# 该用例在共享 runner 上间歇超时：PowerShell 冷启动 + 128KB stderr 在
# FS_HELPER_EXIT_TIMEOUT(2s) 内收不完时，回收路径按"超时不退则强杀"返回
# Ok(())，与"非零退出应报错"的断言相碰。非逻辑问题，多重试几次吸收负载波动。
platform = 'cfg(windows)'
filter = 'package(nova-exec-server) & test(noisy_failing_helper_preserves_exit_status_and_bounded_stderr)'
retries = 3
