[package]
name = "nova-executor-protocol"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
name = "nova_executor_protocol"
path = "src/lib.rs"
doctest = false

[dependencies]
base64 = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
# arbitrary_precision/raw_value：rpc.rs 的节点上限遍历要为 serde_json 的
# 合成 token（$serde_json::private::Number/RawValue）写专门臂——对位 codex
# exec-server-protocol 的 feature 声明
serde_json = { workspace = true, features = ["arbitrary_precision", "raw_value"] }
thiserror = { workspace = true }
schemars = { workspace = true }
ts-rs = { workspace = true }
url = { workspace = true }
nova-executor-file-system = { workspace = true }
nova-executor-network-proxy = { workspace = true }
nova-executor-protocol-core = { workspace = true }
nova-executor-shell-command = { workspace = true }
nova-executor-utils-path-uri = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
