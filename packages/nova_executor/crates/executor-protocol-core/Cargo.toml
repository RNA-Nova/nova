[package]
edition.workspace = true
license.workspace = true
name = "nova-executor-protocol-core"
version = "0.1.0"

[lib]
name = "nova_executor_protocol_core"
path = "src/lib.rs"
doctest = false



[dependencies]
chardetng = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
nova-executor-async-utils = { path = "../executor-async-utils"  }
nova-executor-http-client = { path = "../executor-http-client"  }
nova-executor-network-proxy = { path = "../executor-network-proxy"  }
nova-executor-utils-absolute-path = { path = "../executor-utils-absolute-path"  }
nova-executor-utils-image = { path = "../executor-utils-image"  }
nova-executor-utils-path-uri = { path = "../executor-utils-path-uri"  }
nova-executor-utils-string = { path = "../executor-utils-string"  }
encoding_rs = { workspace = true }
globset = { workspace = true }
http = { workspace = true }
icu_decimal = { workspace = true }
icu_locale_core = { workspace = true }
icu_provider = { workspace = true, features = ["sync"] }
quick-xml = { workspace = true, features = ["serialize"] }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_with = { workspace = true, features = ["macros", "base64"] }
strum = { workspace = true }
strum_macros = { workspace = true }
sys-locale = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
ts-rs = { workspace = true, features = [
    "uuid-impl",
    "serde-json-impl",
    "no-serde-warnings",
] }
uuid = { workspace = true, features = ["serde", "v7", "v4"] }
wildmatch = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
landlock = { workspace = true }
seccompiler = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }

[package.metadata.cargo-shear]
# Required because:
# `icu_provider`: contains a required `sync` feature for `icu_decimal`
# `strum`: is referenced by generated `EnumIter` derive implementations
ignored = ["icu_provider", "strum"]
