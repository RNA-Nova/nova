[tool.poetry]
name = "nova-gateway-protocol"
version = "0.1.0"
description = "Nova Gateway 的独立公开协议 DTO、事件与版本契约。"
authors = ["Liujinming"]
readme = "README.md"
license = "MIT"
packages = [{ include = "nova_gateway_protocol", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.13,<3.14"
pydantic = ">=2.0"
# 兄弟包 nova-protocol 统一由根 pyproject.toml editable 安装。

[tool.poetry.group.dev.dependencies]
pytest = ">=8.2"
pytest-asyncio = ">=1.3"
pytest-timeout = ">=2.3.1"
pytest-socket = ">=0.7.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
target-version = ["py313"]

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true

[tool.pytest.ini_options]
asyncio_mode = "strict"
timeout = 30
addopts = "--disable-socket --allow-unix-socket"
