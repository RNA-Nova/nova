[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nova-executor-client"
version = "0.1.0"
description = "Python SDK for nova-executor remote execution service"
authors = [{ name = "Liujinming" }]
license = { text = "MIT" }
requires-python = ">=3.12,<3.14"
dependencies = [
    "websockets>=12.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nova_executor_client"]

[tool.black]
target-version = ['py312']

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests that call real APIs (deselect with '-m \"not integration\"')",
]
