[tool.poetry]
name = "nova-gateway-client"
version = "0.1.0"
description = "Nova Gateway 官方客户端 SDK。"
authors = ["Liujinming"]
readme = "README.md"
license = "MIT"
packages = [{ include = "nova_gateway_client", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.13,<3.14"
httpx = ">=0.27.0"
pydantic = ">=2.0"
# 兄弟包 nova-protocol / nova-gateway-protocol 统一由根 pyproject.toml
# editable 安装；独立 SDK 不得反向依赖 nova-ai / nova-async / nova-gateway。

[tool.poetry.group.dev.dependencies]
pytest = ">=8.2"
pytest-asyncio = ">=1.3"
pytest-timeout = ">=2.3.1"
pytest-socket = ">=0.7.0"
respx = ">=0.22.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
target-version = ["py313"]

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true

[tool.pytest.ini_options]
asyncio_mode = "strict"
timeout = 30
addopts = "--disable-socket --allow-unix-socket"
markers = [
    "enable_socket: marks tests that may use the network (pytest-socket carve-out)",
]
