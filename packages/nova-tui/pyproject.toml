[tool.poetry]
name = "nova-tui"
version = "0.1.0"
description = "Terminal UI for Nova Harness — Node.js frontend + Python backend"
authors = ["Liujinming"]
readme = "README.md"
license = "MIT"
keywords = ["tui", "agent", "nova", "terminal", "pi-tui"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# Python 服务器已移至 nova_harness 包的 rpc 子模块
# 本包仅包含 Node.js 前端代码

[tool.poetry.dependencies]
python = ">=3.9,<3.13"
nova-harness = { path = "../nova_harness", develop = true }

[tool.uv.sources]
nova-harness = { path = "../nova_harness" }

[tool.poetry.group.dev.dependencies]
black = "^23.10.1"
isort = "^5.12.0"
pytest = "^7.4.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
target-version = ['py311']

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
