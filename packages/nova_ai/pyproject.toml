[tool.poetry]
name = "nova-ai"
version = "0.1.5"
description = "统一的 LLM 提供商抽象层，支持流式调用、模型注册和鉴权。"
authors = ["Liujinming"]
readme = "README.md"
license = "MIT"
keywords = ["llm", "ai", "streaming", "openai", "anthropic", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]

packages = [
    { include = "nova_ai", from = "src" },
]

[tool.poetry.dependencies]
python = ">=3.13,<3.14"
setuptools = "*"
# 上限钉在 <3.10.0：3.10.0（2026-09-08）引入流式收尾回归——
# PoolByteStream 生成器在 athrow 后无法停止，即使显式关流+关客户端也压不住
# "generator didn't stop after athrow()" 噪音；3.9.0 及之前干净。上游修复后放开。
openai = ">=2.0,<3.10.0"
# anthropic SDK（1.x 底座为 httpx2 命名分叉——与 httpx 并存不冲突）
anthropic = ">=1.0"
# 取消作用域（CancelScope——请求/消费段的真杀执行层；>=4.11 归因与
# uncancel 簿记修正），词汇层仍是自家 AbortSignal（TS 对齐）
anyio = ">=4.11"
pydantic = ">=2.0"
json-repair = ">=0.58.4"
httpx = ">=0.27.0"
# Anthropic 1.x 的 HTTP 底座；本包在 retry/timeouts/errors 中直接消费。
httpx2 = ">=2.0,<3"
# 兄弟包 nova-protocol / nova-async / nova-catalog / nova-gateway-protocol /
# nova-gateway-client 统一由根 pyproject.toml editable 安装。

[tool.poetry.group.dev.dependencies]
black = "^23.10.1"
isort = "^5.12.0"
pre-commit = "^3.5.0"
pytest = ">=9.2.0"
pytest-asyncio = ">=1.3"
pytest-timeout = ">=2.3.1"
pytest-socket = ">=0.7.0"
respx = ">=0.22.0"
hypothesis = ">=6.100.0"
sniffio = "^1.3.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
target-version = ['py313']
# 生成物由 nova_ai.scripts.generate 产出，格式以生成器为准——排除出 black/isort
extend-exclude = 'src/nova_ai/(models_generated\.py|providers/data|providers/(anthropic|kimi_coding|moonshotai|moonshotai_cn|openrouter|volcengine)/models\.py)'

[tool.isort]
skip_gitignore = false
extend_skip = [
    "src/nova_ai/models_generated.py",
    "src/nova_ai/providers/data",
    "src/nova_ai/providers/anthropic/models.py",
    "src/nova_ai/providers/kimi_coding/models.py",
    "src/nova_ai/providers/moonshotai/models.py",
    "src/nova_ai/providers/moonshotai_cn/models.py",
    "src/nova_ai/providers/openrouter/models.py",
    "src/nova_ai/providers/volcengine/models.py",
]
profile = "black"
multi_line_output = 3
include_trailing_comma = true

[tool.pytest.ini_options]
asyncio_mode = "strict"
timeout = 30
# 默认套件机械密封：禁网络 socket（asyncio 自唤醒 socketpair 走 unix socket 放行）；
# integration 用例经 pytest.mark.enable_socket 显式解禁
addopts = "--disable-socket --allow-unix-socket"
markers = [
    "integration: marks tests as integration tests that call real APIs (deselect with '-m \"not integration\"')",
    "enable_socket: marks tests that may use the network (pytest-socket carve-out)",
]
