[tool.poetry]
name = "nova-ai"
version = "0.1.1"
description = "统一的 LLM 提供商抽象层，支持流式调用、模型注册和鉴权。"
authors = ["Liujinming"]
readme = "README.md"
license = "MIT"
keywords = ["llm", "ai", "streaming", "openai", "anthropic", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

packages = [
    { include = "nova_ai", from = "src" },
]

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
setuptools = "*"
openai = ">=2.0"
pydantic = ">=2.0"
json-repair = ">=0.58.4"
httpx = ">=0.27.0"

[tool.poetry.group.dev.dependencies]
black = "^23.10.1"
isort = "^5.12.0"
pre-commit = "^3.5.0"
pytest = "^7.4.0"
sniffio = "^1.3.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
target-version = ['py312']
# 生成物由 scripts/generate_models.py 产出，格式以生成器为准——排除出 black/isort
extend-exclude = 'src/nova_ai/(models_generated\.py|providers/data|providers/(kimi_coding|moonshotai|moonshotai_cn|volcengine)/models\.py)'

[tool.isort]
skip_gitignore = false
extend_skip = [
    "src/nova_ai/models_generated.py",
    "src/nova_ai/providers/data",
    "src/nova_ai/providers/kimi_coding/models.py",
    "src/nova_ai/providers/moonshotai/models.py",
    "src/nova_ai/providers/moonshotai_cn/models.py",
    "src/nova_ai/providers/volcengine/models.py",
]
profile = "black"
multi_line_output = 3
include_trailing_comma = true

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests that call real APIs (deselect with '-m \"not integration\"')",
]
