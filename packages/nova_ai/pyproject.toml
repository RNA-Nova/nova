[tool.poetry]
name = "nova-ai"
version = "0.1.0"
description = "统一的 LLM 提供商抽象层，支持流式调用、模型注册和鉴权。"
authors = ["Liujinming"]
readme = "README.md"
license = "MIT"
keywords = ["llm", "ai", "streaming", "openai", "anthropic", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

packages = [
    { include = "nova_ai", from = "src" },
]

[tool.poetry.dependencies]
python = ">=3.9,<3.13"
setuptools = "*"
openai = ">=1.109.1"
mashumaro = ">=3.20"
json-repair = ">=0.58.4"

[tool.poetry.group.dev.dependencies]
black = "^23.10.1"
isort = "^5.12.0"
pre-commit = "^3.5.0"
pytest = "^7.4.0"
sniffio = "^1.3.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
target-version = ['py311']

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
