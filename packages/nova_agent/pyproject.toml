[tool.poetry]
name = "nova-agent"
version = "0.1.0"
description = "事件驱动的异步 Agent 框架，负责状态管理、工具执行、消息队列和生命周期控制。"
authors = ["Liujinming"]
readme = "README.md"
license = "MIT"
keywords = ["agent", "llm", "async", "event-driven", "tool-calling"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

packages = [
    { include = "nova_agent", from = "src" },
]

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
setuptools = "*"
pydantic = "^2.0"
jsonschema = "^4.0"

[tool.poetry.group.dev.dependencies]
black = "^23.10.1"
isort = "^5.12.0"
pre-commit = "^3.5.0"
pytest = "^7.4.0"
pytest-asyncio = "^0.23.8"
sniffio = "^1.3.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
target-version = ['py312']

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests that call real APIs (deselect with '-m \"not integration\"')",
]
asyncio_mode = "auto"
