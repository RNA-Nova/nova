[package]
name = "nova-exec-server-execpolicy"
version = "0.1.0"
edition.workspace = true
license = "Apache-2.0"
description = "Exec policy engine: prefix-based Starlark rules for command decisions (derived from Codex execpolicy)."

[lib]
name = "nova_exec_server_execpolicy"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "nova-exec-server-execpolicy"
path = "src/main.rs"



[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive"] }
nova-exec-server-utils-absolute-path = { path = "../nova-exec-server/crates/exec-server-utils-absolute-path"  }
multimap = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
shlex = { workspace = true }
starlark = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "rt"] }

[dev-dependencies]
pretty_assertions = { workspace = true }
