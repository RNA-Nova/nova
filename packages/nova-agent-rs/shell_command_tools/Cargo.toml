# 存档 crate（不进 workspace、不参与构建）——agent 层命令解析与安全判定备件。
# 从 nova-executor-shell-command 挪出；启用时接回 workspace 并修复漂移。
[package]
name = "nova-agent-shell-command-tools"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
# 依赖 nova-executor-shell-command 的 shell_detect（ShellType/detect_shell_type）
nova-executor-shell-command = { path = "../../nova_executor/crates/executor-shell-command" }
base64 = "1"
libc = "0.2"
once_cell = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "1"
tree-sitter = "0.25.10"
tree-sitter-bash = "0.25"
tree-sitter-powershell = "=0.26.4"
url = "2"
which = "8"

[dev-dependencies]
anyhow = "1"
pretty_assertions = "1"
tempfile = "3"
