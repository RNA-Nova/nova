[tool.poetry]
name = "nova-harness"
version = "0.1.0"
description = "基于 nova_ai + nova_agent 构建的高阶 Agent SDK，提供会话管理、上下文压缩和资源加载。"
authors = ["Liujinming"]
readme = "README.md"
license = "MIT"
keywords = ["agent", "session", "harness", "llm", "sdk", "compaction"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

packages = [
    { include = "nova_harness", from = "src" },
]

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
pydantic = "^2.0"
# 兄弟包（nova-ai/nova-agent）不在此处声明 path 依赖——各包独立管理
# 第三方依赖；安装部署由脚本统一完成，发布时再恢复互依声明。
pyyaml = "^6.0.1"
filelock = "^3.24.3"
tomli = { version = "^2.0.1", python = "<3.11" }
uuid6 = ">=2024.7.10"
pathspec = ">=0.12.1"

[tool.poetry.group.dev.dependencies]
black = "^23.10.1"
isort = "^5.12.0"
pre-commit = ">=3.5,<5.0"
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
sniffio = "^1.3.0"

[tool.uv.sources]
nova-ai = { path = "../../nova_ai" }
nova-agent = { path = "../../nova_agent" }

[tool.poetry.scripts]
nova-harness = "nova_harness.cli.main:main"
nova-harness-rpc = "nova_harness.modes.rpc.cli:main"
nova-pkg = "nova_harness.cli.package:main"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
target-version = ['py312']

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: 需要真实 API Key 的集成测试",
]
