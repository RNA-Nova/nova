[tool.poetry]
name = "nova-exec-protocol"
version = "0.1.0"
description = "Nova executor 版本化线上协议（JSON-RPC wire DTO）。"
authors = ["Liujinming"]
readme = "README.md"
license = "MIT"
keywords = ["executor", "protocol", "json-rpc", "sandbox"]

[tool.poetry.dependencies]
python = ">=3.13,<3.14"
pydantic = ">=2.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.4,<10"
pytest-asyncio = ">=1.3"
pytest-socket = ">=0.7.0"
pytest-timeout = ">=2.3.1"

[tool.pytest.ini_options]
asyncio_mode = "strict"
timeout = 30
addopts = "--disable-socket --allow-unix-socket"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
