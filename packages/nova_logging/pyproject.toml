[tool.poetry]
name = "nova-logging"
version = "0.1.0"
description = "Nova 结构化日志机制——多 sink、目标过滤、有界异步输出、flush 与超时关停。"
authors = ["Liujinming"]
readme = "README.md"
license = "MIT"
keywords = ["logging", "structlog", "contextvars", "observability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
packages = [
    { include = "nova_logging", from = "src" },
]

[tool.poetry.dependencies]
python = ">=3.13,<3.14"
structlog = ">=26.1.0,<27"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.2"
pytest-asyncio = ">=1.3"
pytest-timeout = ">=2.3.1"
pytest-socket = ">=0.7.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "strict"
timeout = 30
addopts = "--disable-socket --allow-unix-socket"
