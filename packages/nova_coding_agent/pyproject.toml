[tool.poetry]
name = "nova-coding-agent"
version = "1.0.0"
description = "Nova coding agent with local file system tools"
authors = ["nova"]
readme = "README.md"
license = "MIT"
packages = [
    { include = "nova_coding_agent", from = "backend" },
]
keywords = ["agent", "coding", "llm", "tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# 这是一个 Nova bundle，同时也是一个可 import 的 Python 包。
# tools/ 下的 executor 通过 ``from nova_coding_agent.tools_common import ...``
# 复用 bundle 内部共享辅助模块。安装时 nova-pkg 会执行 ``pip install -e .``。

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
# 兄弟包（nova-ai/nova-agent/nova-harness）不在此处声明 path 依赖——
# 各包独立管理第三方依赖；安装部署由脚本统一完成（见根 pyproject 的
# pixi workspace 清单），发布时再恢复互依声明。
# read 工具的图片缩放（对齐 pi processImage：限制到 2000x2000 内，保护模型图像预算）
Pillow = "^10.0"

[tool.poetry.group.dev.dependencies]
black = "^23.10.1"
isort = "^5.12.0"
pre-commit = "^3.5.0"
pytest = "^7.4.0"
sniffio = "^1.3.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
target-version = ['py312']

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true

[tool.uv.sources]
nova-ai = { path = "../nova_ai" }
nova-agent = { path = "../nova_agent" }
nova-harness = { path = "../nova-harness/backend" }

[tool.nova]
agents = [
    "./agents/"
]
tools = [
    "./backend/tools/bash.py",
    "./backend/tools/edit.py",
    "./backend/tools/find.py",
    "./backend/tools/grep.py",
    "./backend/tools/ls.py",
    "./backend/tools/question.py",
    "./backend/tools/read.py",
    "./backend/tools/subagent.py",
    "./backend/tools/todo.py",
    "./backend/tools/write.py"
]
skills = []
personas = [
    "./backend/personas/"
]
extensions = [
    "./backend/extensions/confirm_destructive.py",
    "./backend/extensions/executor_switch.py",
    "./backend/extensions/interactive_shell.py",
    "./backend/extensions/permission_gate.py",
    "./backend/extensions/plan_mode.py",
    "./backend/extensions/session_commands.py",
    "./backend/extensions/subagent_gate.py",
    "./backend/extensions/tools_panel.py"
]
prompts = [
    "./backend/prompts/debug.md",
    "./backend/prompts/implement-and-review.md",
    "./backend/prompts/implement.md",
    "./backend/prompts/refactor.md",
    "./backend/prompts/scout-and-plan.md"
]
user_tools = [
    "./backend/user_tools/bash.py"
]
auto_install_dependencies = true
# 二进制依赖（wheel 可装）：rg → ripgrep 平台 wheel（pin 版本保证可复现，
# 对齐框架注册表的 pin 纪律）。
# grep/find 工具经 resolve_binary 命中后获得原生加速，未命中走纯 Python 兜底。
binary_dependencies = { rg = "ripgrep==15.1.0" }
# 自管理二进制（框架注册表，无 wheel）：fd 的目录查找是 rg --files 覆盖不了的
# 场景（find_type="directory"）。安装时按 pin 版本 + sha256 下载到 nova bin。
binary_managed_dependencies = ["fd"]


[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests that call real APIs (deselect with '-m \"not integration\"')",
]
# 单测挂死保险丝：超时即转储全线程栈并判红（不配死锁会冻结整条流水线）
faulthandler_timeout = 120
