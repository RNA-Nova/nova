[tool.poetry]
name = "nova-coding-agent"
version = "1.0.0"
description = "Nova coding agent with local file system tools"
authors = ["nova"]
readme = "README.md"
license = "MIT"
keywords = ["agent", "coding", "llm", "tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# 注意：这是一个纯 Nova bundle，不再作为可 import 的 Python 包。
# pyproject.toml 仅用于声明 Python 运行时依赖（供 nova-pkg install 读取）
# 以及开发工具配置（black / isort / pytest）。

[tool.poetry.dependencies]
python = ">=3.9,<3.13"
nova-ai = { path = "../nova_ai", develop = true }
nova-agent = { path = "../nova_agent", develop = true }
nova-harness = { path = "../nova_harness", develop = true }

[tool.poetry.group.dev.dependencies]
black = "^23.10.1"
isort = "^5.12.0"
pre-commit = "^3.5.0"
pytest = "^7.4.0"
sniffio = "^1.3.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
target-version = ['py311']

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
