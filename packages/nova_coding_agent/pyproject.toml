[tool.poetry]
name = "nova-coding-agent"
version = "1.0.0"
description = "Nova coding agent with local file system tools"
authors = ["nova"]
readme = "README.md"
license = "MIT"
packages = [
    { include = "nova_coding_agent", from = "src" },
]
keywords = ["agent", "coding", "llm", "tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# 这是一个 Nova bundle，同时也是一个可 import 的 Python 包。
# tools/ 下的 executor 通过 ``from nova_coding_agent.tools_common import ...``
# 复用 bundle 内部共享辅助模块。安装时 nova-pkg 会执行 ``pip install -e .``。

[tool.poetry.dependencies]
python = ">=3.9,<3.13"
nova-ai = { path = "../nova_ai", develop = true }
nova-agent = { path = "../nova_agent", develop = true }
nova-harness = { path = "../nova_harness", develop = true }

[tool.poetry.group.dev.dependencies]
black = "^23.10.1"
isort = "^5.12.0"
pre-commit = "^3.5.0"
pytest = "^7.4.0"
sniffio = "^1.3.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
target-version = ['py311']

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true

[tool.uv.sources]
nova-ai = { path = "../nova_ai" }
nova-agent = { path = "../nova_agent" }
nova-harness = { path = "../nova_harness" }

[tool.nova]
agents = [
    "./agents/coding_agent"
]
tools = [
    "./tools/bash",
    "./tools/edit",
    "./tools/find",
    "./tools/grep",
    "./tools/ls",
    "./tools/read",
    "./tools/subagent",
    "./tools/write"
]
skills = []
extensions = [
    "./extensions/session_commands"
]
prompts = [
    "./prompts/debug.md",
    "./prompts/refactor.md"
]
auto_install_dependencies = true

