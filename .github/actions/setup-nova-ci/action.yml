name: setup-nova-ci
description: executor CI 公共环境准备（对位 codex .github/actions/setup-ci 的 nova 裁剪版）

runs:
  using: composite
  steps:
    # 受控构建根 + 受控临时目录（对位 codex setup-ci）：TEMP/TMP/TMPDIR 指向
    # 受控长路径——杜绝 GHA 宿主 8.3 短名 TEMP（C:\Users\RUNNER~1\...）类差异；
    # CARGO_TARGET_DIR 归到构建根（自建 runner 上常驻 = 增量构建）。
    # Windows 构建根固定在 C:\nova-ci（理由见其步骤注释）；
    # Windows 步骤必须走 pwsh——git-bash 的 $HOME 是 MSYS 形（/c/Users/...），
    # 拼路径会被 cargo/link.exe 错拼（CI run 38074535685 实证 LNK1104）。
    - name: 配置 CI 构建根与受控临时目录（Unix）
      if: runner.os != 'Windows'
      shell: bash
      run: |
        set -euo pipefail
        build_root="$HOME/.cache/nova-ci"
        mkdir -p "$build_root/tmp" "$build_root/cargo-target"
        {
          echo "NOVA_CI_BUILD_ROOT=$build_root"
          echo "TEMP=$build_root/tmp"
          echo "TMP=$build_root/tmp"
          echo "CARGO_TARGET_DIR=$build_root/cargo-target"
        } >> "$GITHUB_ENV"
        # 自建 runner 的非交互 shell 可能不加载 ~/.bashrc 里的 cargo PATH
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

    # Windows 构建根/临时目录放 C:\nova-ci（系统盘顶一级目录，NTFS）：
    # - 不用 runneradmin profile：提升沙箱账户是另一个 Windows 用户，对
    #   C:\Users\runneradmin 无遍历权，以其下 TempDir 为提升子进程 cwd 时
    #   CreateProcessWithLogonW 报 267（tmpdir_uses_command_environment_over_
    #   rpc::elevated，run 38383429724 实证）。cwd 校验用的是登录后的完整
    #   token（受限化发生在子进程内部），需要祖先链对沙箱账户可读可遍历；
    #   C:\ 根默认带 Users:(OI)(CI)RX，盘顶新目录自动继承，再显式授一次兜底。
    # - 不用 GHA 现镜像的 D:（已是 ReFS Dev Drive）：锚点逐字的 junction/沙箱
    #   写用例在其上 Access denied（file_system_operations_can_reject_junctions
    #   _in_any_path_component::local，run 38389531315 实证）；codex 的
    #   setup-dev-drive 机制面向其自托管 runner 的构建 I/O 性能，不照搬。
    # 沙箱执法不受此授权影响——读写限制由受限 token（token 内只剩 capability
    # SID，Users ACE 对其不可见）与显式 deny ACE 实现，继承来的 Users:RX
    # 既不授写也不削弱 deny。
    # TEMP/TMP 用反斜杠原生形（cwd 会直传 CreateProcessWithLogonW）；
    # CARGO_TARGET_DIR 保持正斜杠（git-bash cp 消费，run 38074535685 实证
    # MSYS 不解析反斜杠路径）。
    - name: 配置 CI 构建根与受控临时目录（Windows）
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path "C:\nova-ci\tmp", "C:\nova-ci\cargo-target" | Out-Null
        icacls "C:\nova-ci" /grant "*S-1-5-32-545:(OI)(CI)RX" | Out-Null
        "NOVA_CI_BUILD_ROOT=C:/nova-ci" >> $env:GITHUB_ENV
        "TEMP=C:\nova-ci\tmp" >> $env:GITHUB_ENV
        "TMP=C:\nova-ci\tmp" >> $env:GITHUB_ENV
        "CARGO_TARGET_DIR=C:/nova-ci/cargo-target" >> $env:GITHUB_ENV

    # Linux 沙箱测试依赖（幂等：自建 runner 已预配 /usr/bin/bwrap + sysctl，
    # 即跳过；GHA 宿主每次新机现场装——runner 一次性 VM，无残留影响）。
    - name: Linux 沙箱测试依赖
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        if ! command -v bwrap >/dev/null 2>&1; then
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap
        fi
        if [[ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo 0)" != "0" ]]; then
          sudo sysctl kernel.apparmor_restrict_unprivileged_userns=0
        fi

    # Windows 长路径（对位 codex setup-ci 末尾）
    - name: 启用 Git 长路径（Windows）
      if: runner.os == 'Windows'
      shell: pwsh
      run: git config --global core.longpaths true
