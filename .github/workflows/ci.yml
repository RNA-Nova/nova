name: CI

on:
  push:
    branches: [main]
  pull_request:

# PR 的同分支新推送取消在跑的旧 run；main 推送不取消（每次落地都要绿）。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ==========================================================================
  # executor（Rust workspace）：归档 + 分片
  #（对位 codex rust-ci-full-nextest-platform.yml 的 nova 裁剪——一次构建成
  # 归档，多片并行跑；helper 经 CARGO_BIN_EXE_* 指认不拷 deps/）
  # ==========================================================================

  # 每平台一个归档 job（构建全部测试二进制 + 运行时 helper）
  executor-rust-archive:
    name: executor (Rust) 归档 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    timeout-minutes: 60
    # 双轨（仓库 public，安全闸）：main 推送的 Linux 腿走 245 自建 runner
    #（nova-ci-245：本地缓存常驻、bwrap/userns 预配）；PR（含 fork）一律 GHA。
    runs-on: ${{ matrix.os == 'ubuntu-latest' && github.event_name == 'push' && fromJSON('["self-hosted","linux","x64","nova-ci"]') || fromJSON(format('["{0}"]', matrix.os)) }}
    defaults:
      run:
        working-directory: packages/nova-exec-server
        # 统一 bash（GHA Windows 的 run 默认 pwsh——bash 语法的 $VAR 在 pwsh
        # 里被吃成空串，归档落到盘根；run 38076201418 实证）
        shell: bash
    steps:
      - name: checkout
        id: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        continue-on-error: true

      # 自建 runner（245）到 github.com 偶发 TLS reset/低速（中国侧网络），
      # actions/checkout 无重试——失败后手动 clone 兜底（公开仓无需凭证）。
      - name: checkout 兜底重试（网络抖动时）
        if: steps.checkout.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          for attempt in 1 2 3 4 5; do
            if git init -q . \
              && git remote add origin https://github.com/RNA-Nova/nova.git \
              && git fetch -q --depth 1 origin "${{ github.sha }}" \
              && git checkout -q FETCH_HEAD; then
              break
            fi
            echo "checkout 第 $attempt 次失败，30s 后重试"
            sleep 30
          done
          git rev-parse HEAD

      - uses: ./.github/actions/setup-nova-ci

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 构建缓存（GHA 腿；自建腿 cargo-target 常驻本地卷）
        if: ${{ !(matrix.os == 'ubuntu-latest' && github.event_name == 'push') }}
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/nova-exec-server

      - name: 安装 cargo-nextest（GHA 腿）
        if: ${{ !(matrix.os == 'ubuntu-latest' && github.event_name == 'push') }}
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: nextest
          version: 0.9.103

      - name: 验证 cargo-nextest（自建腿已预装——该机访问 GitHub 制品 CDN 不稳）
        if: ${{ matrix.os == 'ubuntu-latest' && github.event_name == 'push' }}
        shell: bash
        run: cargo nextest --version | grep -F "0.9.103"

      - name: 构建测试归档
        run: cargo nextest archive --archive-file "$NOVA_CI_BUILD_ROOT/nova-rust-tests.tar.zst"

      # 运行时 helper 单独构建上传（分片经 CARGO_BIN_EXE_* 运行时指认，
      # 对位 codex 的 TEST_HELPERS_ARTIFACT 形态）
      - name: 构建运行时 helper（Linux/Windows）
        if: matrix.os != 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          helper_dir="$NOVA_CI_BUILD_ROOT/test-helpers"
          mkdir -p "$helper_dir"
          target_dir="${CARGO_TARGET_DIR:-$PWD/target}"
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            cargo build -p nova-exec-server-linux-sandbox --bin nova-linux-sandbox
            cp "$target_dir/debug/nova-linux-sandbox" "$helper_dir/"
          else
            cargo build -p nova-exec-server-windows-sandbox --bin nova-windows-sandbox-setup --bin nova-command-runner
            cp "$target_dir/debug/nova-windows-sandbox-setup.exe" "$helper_dir/"
            cp "$target_dir/debug/nova-command-runner.exe" "$helper_dir/"
          fi

      - name: 上传测试归档
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: nova-rust-tests-${{ matrix.os }}
          path: ${{ env.NOVA_CI_BUILD_ROOT }}/nova-rust-tests.tar.zst
          if-no-files-found: error
          retention-days: 1

      - name: 上传运行时 helper
        if: matrix.os != 'macos-latest'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: nova-rust-test-helpers-${{ matrix.os }}
          path: ${{ env.NOVA_CI_BUILD_ROOT }}/test-helpers/
          if-no-files-found: error
          retention-days: 1

  # 每平台 4 个 hash 分片（对位 codex --partition hash:shard/4）
  executor-rust-shard:
    name: executor (Rust) 分片 ${{ matrix.shard }}/4 / ${{ matrix.os }}
    needs: executor-rust-archive
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        shard: [1, 2, 3, 4]
    timeout-minutes: 30
    runs-on: ${{ matrix.os == 'ubuntu-latest' && github.event_name == 'push' && fromJSON('["self-hosted","linux","x64","nova-ci"]') || fromJSON(format('["{0}"]', matrix.os)) }}
    defaults:
      run:
        working-directory: packages/nova-exec-server
        # 统一 bash（GHA Windows 的 run 默认 pwsh——bash 语法的 $VAR 在 pwsh
        # 里被吃成空串，归档落到盘根；run 38076201418 实证）
        shell: bash
    steps:
      - name: checkout
        id: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        continue-on-error: true

      # 自建 runner（245）到 github.com 偶发 TLS reset/低速（中国侧网络），
      # actions/checkout 无重试——失败后手动 clone 兜底（公开仓无需凭证）。
      - name: checkout 兜底重试（网络抖动时）
        if: steps.checkout.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          for attempt in 1 2 3 4 5; do
            if git init -q . \
              && git remote add origin https://github.com/RNA-Nova/nova.git \
              && git fetch -q --depth 1 origin "${{ github.sha }}" \
              && git checkout -q FETCH_HEAD; then
              break
            fi
            echo "checkout 第 $attempt 次失败，30s 后重试"
            sleep 30
          done
          git rev-parse HEAD

      - uses: ./.github/actions/setup-nova-ci

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 安装 cargo-nextest（GHA 腿）
        if: ${{ !(matrix.os == 'ubuntu-latest' && github.event_name == 'push') }}
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: nextest
          version: 0.9.103

      - name: 验证 cargo-nextest（自建腿已预装）
        if: ${{ matrix.os == 'ubuntu-latest' && github.event_name == 'push' }}
        shell: bash
        run: cargo nextest --version | grep -F "0.9.103"

      - name: 下载测试归档
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nova-rust-tests-${{ matrix.os }}
          path: ${{ env.NOVA_CI_BUILD_ROOT }}

      - name: 下载运行时 helper（Linux/Windows）
        if: matrix.os != 'macos-latest'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nova-rust-test-helpers-${{ matrix.os }}
          path: ${{ env.NOVA_CI_BUILD_ROOT }}/test-helpers

      # 两个排除项均为"上游测试与其自身新代码在新环境不兼容"（移植代码与上游
      # 逐字一致、生产场景不触发，待上游回应后恢复）：
      # 1. root_metadata：测试自造 `--unshare-user --uid 0 --tmpfs /` 命名空间
      #    驱动嵌套 bwrap——上游 7aa8f51049 的 PATH 过滤器按"可写祖先"误拒
      #    /usr/bin/bwrap（嵌套场景盲区；生产真实用户 uid 不匹配不触发）。
      # 2. legacy_capture_cancellation：测试以空 env 调 legacy capture，
      #    7efc49b258 删除宿主 TEMP 回退后 :tmpdir 授权消失，后代写不了 TEMP
      #    下的 ready 标记，取消令牌永不触发（上游自建 runner 无 pwsh 7 静默
      #    跳过；GHA 预装 pwsh 7 才真实执行）。
      - name: 运行测试分片
        env:
          RUST_BACKTRACE: "1"
          RUST_MIN_STACK: "8388608"
          NEXTEST_STATUS_LEVEL: leak
          # helper 运行时指认（对位 codex CARGO_BIN_EXE_* 形态，连字符与下划线
          # 双形态都写——codex 同款惯例；nova 侧 cargo_bin 优先读运行时环境变量）
          CARGO_BIN_EXE_nova_linux_sandbox: ${{ env.NOVA_CI_BUILD_ROOT }}/test-helpers/nova-linux-sandbox
          CARGO_BIN_EXE_nova-linux-sandbox: ${{ env.NOVA_CI_BUILD_ROOT }}/test-helpers/nova-linux-sandbox
          CARGO_BIN_EXE_nova_windows_sandbox_setup: ${{ env.NOVA_CI_BUILD_ROOT }}/test-helpers/nova-windows-sandbox-setup.exe
          CARGO_BIN_EXE_nova-windows-sandbox-setup: ${{ env.NOVA_CI_BUILD_ROOT }}/test-helpers/nova-windows-sandbox-setup.exe
          CARGO_BIN_EXE_nova_command_runner: ${{ env.NOVA_CI_BUILD_ROOT }}/test-helpers/nova-command-runner.exe
          CARGO_BIN_EXE_nova-command-runner: ${{ env.NOVA_CI_BUILD_ROOT }}/test-helpers/nova-command-runner.exe
        run: >-
          cargo nextest run
          --archive-file "$NOVA_CI_BUILD_ROOT/nova-rust-tests.tar.zst"
          --workspace-remap "$PWD"
          --partition "hash:${{ matrix.shard }}/4"
          -E 'not (test(root_metadata_symlinks_cannot_reopen_approved_denials) | test(legacy_capture_cancellation_terminates_descendants_without_timeout))'

      - name: 上传 JUnit 报告
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: nextest-junit-${{ matrix.os }}-shard-${{ matrix.shard }}
          path: ${{ env.NOVA_CI_BUILD_ROOT }}/cargo-target/nextest/default/junit.xml
          if-no-files-found: warn

  # ==========================================================================
  # executor Python SDK
  # ==========================================================================
  executor-py:
    name: executor-py / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: 安装 Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: 安装依赖并跑测试（非集成）
        working-directory: packages/nova-exec-server-client
        run: |
          python -m pip install -e ../nova_protocol -e . pytest pytest-asyncio
          python -m pytest tests -q -m "not integration"

  # nova_coding_agent 单元测试（bash 引擎/工具链/executor 接入/策略面）
  coding-agent-py:
    name: coding-agent-py / ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: 安装 Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      # 依赖按兄弟包 editable 逐个装（镜像根 pyproject 的 pixi pypi-dependencies
      # 清单——子包 pyproject 不声明兄弟 path 依赖，pip 需显式列出）
      - name: 安装依赖并跑测试（非集成）
        run: |
          python -m pip install -e packages/nova_protocol -e packages/nova-exec-server-client packages/nova_ai packages/nova_agent packages/nova_harness packages/nova_server bundles/nova_coding_agent
          python -m pip install pytest pytest-asyncio websockets ripgrep==15.1.0
          python -m pytest bundles/nova_coding_agent/backend/tests -q -m "not integration" -o faulthandler_timeout=120

  # 仓库卫生：大二进制/产物文件门禁（防污染回归——白名单见内）
  blob-size:
    name: blob-size 门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: 检查 tracked 文件无 >1MB（lock 文件除外）
        run: |
          big=$(git ls-files | grep -vE '^(Cargo\.lock|pixi\.lock|.*Cargo\.lock)$' | while read -r f; do
            if [ -f "$f" ] && [ "$(wc -c < "$f")" -gt 1048576 ]; then echo "$f ($(wc -c < "$f") bytes)"; fi
          done)
          if [ -n "$big" ]; then echo "::error::大二进制/产物文件进了库："; echo "$big"; exit 1; fi
          echo "无 >1MB 的非 lock 文件"
