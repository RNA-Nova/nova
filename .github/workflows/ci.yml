name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # executor（Rust workspace）三平台矩阵
  executor-rust:
    name: executor (Rust) / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: packages/nova_executor
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 构建缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/nova_executor

      # Linux fs 沙箱测试需要真实 bwrap：ubuntu-24.04 镜像不预装 bubblewrap，
      # 且默认 kernel.apparmor_restrict_unprivileged_userns=1 会拦住非特权
      # userns 创建（runner 为一次性 VM，sysctl 放开无残留影响）
      - name: 安装 Linux 沙箱测试依赖
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap
          sudo sysctl kernel.apparmor_restrict_unprivileged_userns=0

      - name: 安装 cargo-nextest（对齐 codex 的测试 runner：每测试独立进程）
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: nextest
          version: 0.9.103

      - name: cargo build
        run: cargo build --workspace

      # nextest 天然全量重跑（失败不中断后续用例），无需 --no-fail-fast；
      # doc-tests 不在 nextest 覆盖范围（与 codex 一致）
      - name: cargo nextest run
        run: cargo nextest run --workspace

  # executor Python SDK
  executor-py:
    name: executor-py / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: 安装 Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: 安装依赖并跑测试（非集成）
        working-directory: packages/nova-executor-client
        run: |
          python -m pip install -e . pytest pytest-asyncio
          python -m pytest tests -q -m "not integration"

  # nova_coding_agent 单元测试（bash 引擎/工具链/executor 接入/策略面）
  coding-agent-py:
    name: coding-agent-py / ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: 安装 Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # 依赖按兄弟包 editable 逐个装（镜像根 pyproject 的 pixi pypi-dependencies
      # 清单——子包 pyproject 不声明兄弟 path 依赖，pip 需显式列出）
      - name: 安装依赖并跑测试（非集成）
        run: |
          python -m pip install -e packages/nova-executor-client packages/nova_ai packages/nova_agent packages/nova_harness packages/nova_server bundles/nova_coding_agent
          python -m pip install pytest pytest-asyncio websockets ripgrep==15.1.0
          python -m pytest bundles/nova_coding_agent/backend/tests -q -m "not integration" -o faulthandler_timeout=120

  # 仓库卫生：大二进制/产物文件门禁（防污染回归——白名单见内）
  blob-size:
    name: blob-size 门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: 检查 tracked 文件无 >1MB（lock 文件除外）
        run: |
          big=$(git ls-files | grep -vE '^(Cargo\.lock|pixi\.lock|.*Cargo\.lock)$' | while read -r f; do
            if [ -f "$f" ] && [ "$(wc -c < "$f")" -gt 1048576 ]; then echo "$f ($(wc -c < "$f") bytes)"; fi
          done)
          if [ -n "$big" ]; then echo "::error::大二进制/产物文件进了库："; echo "$big"; exit 1; fi
          echo "无 >1MB 的非 lock 文件"
