name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # executor（Rust workspace）三平台矩阵
  executor-rust:
    name: executor (Rust) / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: packages/nova-exec-server
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 构建缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/nova-exec-server

      # Linux fs 沙箱测试需要真实 bwrap：ubuntu-24.04 镜像不预装 bubblewrap，
      # 且默认 kernel.apparmor_restrict_unprivileged_userns=1 会拦住非特权
      # userns 创建（runner 为一次性 VM，sysctl 放开无残留影响）
      - name: 安装 Linux 沙箱测试依赖
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap
          sudo sysctl kernel.apparmor_restrict_unprivileged_userns=0

      - name: 安装 cargo-nextest（对齐 codex 的测试 runner：每测试独立进程）
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: nextest
          version: 0.9.103

      - name: cargo build
        run: cargo build --workspace

      # Windows 沙箱 helper 摆放（对齐 codex rust-ci-full-nextest-platform.yml）：
      # unified_exec elevated 路径经 helper_materialization 按"当前可执行文件旁/
      # nova-resources 下"查找 nova-command-runner.exe——测试二进制在 deps/ 下，
      # 必须把 cargo build 产出的两个 helper 拷过去，否则退回裸文件名导致
      # CreateProcessWithLogonW ERROR_FILE_NOT_FOUND(2)
      - name: 摆放 Windows 沙箱测试 helper
        if: matrix.os == 'windows-latest'
        run: |
          cp target/debug/nova-command-runner.exe target/debug/deps/
          cp target/debug/nova-windows-sandbox-setup.exe target/debug/deps/

      # GHA 宿主 runner 的 TEMP 默认是 8.3 短名（C:\Users\RUNNER~1\...），
      # 上游测试假设 temp.path() 与 dunce::canonicalize 同形（lexical==canonical，
      # 对位 codex de3721a7be 的 deny_read_state_tests）；解析为长名后再跑测试。
      - name: 解析 TEMP 为长路径名
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Add-Type -Namespace Native -Name Win32 -MemberDefinition '[System.Runtime.InteropServices.DllImport("kernel32.dll", CharSet = System.Runtime.InteropServices.CharSet.Unicode)] public static extern uint GetLongPathName(string lpszShortPath, System.Text.StringBuilder lpszLongPath, uint cchBuffer);'
          $sb = New-Object System.Text.StringBuilder 1024
          [void][Native.Win32]::GetLongPathName($env:TEMP, $sb, $sb.Capacity)
          "TEMP=$($sb.ToString())" >> $env:GITHUB_ENV
          "TMP=$($sb.ToString())" >> $env:GITHUB_ENV

      # nextest 天然全量重跑（失败不中断后续用例），无需 --no-fail-fast；
      # doc-tests 不在 nextest 覆盖范围（与 codex 一致）
      - name: cargo nextest run
        run: cargo nextest run --workspace

  # executor Python SDK
  executor-py:
    name: executor-py / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: 安装 Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: 安装依赖并跑测试（非集成）
        working-directory: packages/nova-exec-server-client
        run: |
          python -m pip install -e ../nova_protocol -e . pytest pytest-asyncio
          python -m pytest tests -q -m "not integration"

  # nova_coding_agent 单元测试（bash 引擎/工具链/executor 接入/策略面）
  coding-agent-py:
    name: coding-agent-py / ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: 安装 Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      # 依赖按兄弟包 editable 逐个装（镜像根 pyproject 的 pixi pypi-dependencies
      # 清单——子包 pyproject 不声明兄弟 path 依赖，pip 需显式列出）
      - name: 安装依赖并跑测试（非集成）
        run: |
          python -m pip install -e packages/nova_protocol -e packages/nova-exec-server-client packages/nova_ai packages/nova_agent packages/nova_harness packages/nova_server bundles/nova_coding_agent
          python -m pip install pytest pytest-asyncio websockets ripgrep==15.1.0
          python -m pytest bundles/nova_coding_agent/backend/tests -q -m "not integration" -o faulthandler_timeout=120

  # 仓库卫生：大二进制/产物文件门禁（防污染回归——白名单见内）
  blob-size:
    name: blob-size 门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: 检查 tracked 文件无 >1MB（lock 文件除外）
        run: |
          big=$(git ls-files | grep -vE '^(Cargo\.lock|pixi\.lock|.*Cargo\.lock)$' | while read -r f; do
            if [ -f "$f" ] && [ "$(wc -c < "$f")" -gt 1048576 ]; then echo "$f ($(wc -c < "$f") bytes)"; fi
          done)
          if [ -n "$big" ]; then echo "::error::大二进制/产物文件进了库："; echo "$big"; exit 1; fi
          echo "无 >1MB 的非 lock 文件"
