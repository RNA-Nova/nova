name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # executor（Rust workspace）三平台矩阵
  executor-rust:
    name: executor (Rust) / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: packages/nova_executor
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 构建缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/nova_executor

      - name: cargo build
        run: cargo build --workspace

      - name: cargo test
        run: cargo test --workspace --no-fail-fast

  # executor Python SDK
  executor-py:
    name: executor-py / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖并跑测试（非集成）
        working-directory: packages/nova-executor-py
        run: |
          python -m pip install -e . pytest pytest-asyncio
          python -m pytest tests -q -m "not integration"
