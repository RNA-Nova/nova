name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # executor（Rust workspace）三平台矩阵
  executor-rust:
    name: executor (Rust) / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: packages/nova_executor
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 构建缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/nova_executor

      - name: cargo build
        run: cargo build --workspace

      - name: cargo test
        run: cargo test --workspace --no-fail-fast

  # executor Python SDK
  executor-py:
    name: executor-py / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖并跑测试（非集成）
        working-directory: packages/nova-executor-client
        run: |
          python -m pip install -e . pytest pytest-asyncio
          python -m pytest tests -q -m "not integration"

  # 仓库卫生：大二进制/产物文件门禁（防污染回归——白名单见内）
  blob-size:
    name: blob-size 门禁
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检查 tracked 文件无 >1MB（lock 文件除外）
        run: |
          big=$(git ls-files | grep -vE '^(Cargo\.lock|pixi\.lock|.*Cargo\.lock)$' | while read -r f; do
            if [ -f "$f" ] && [ "$(wc -c < "$f")" -gt 1048576 ]; then echo "$f ($(wc -c < "$f") bytes)"; fi
          done)
          if [ -n "$big" ]; then echo "::error::大二进制/产物文件进了库："; echo "$big"; exit 1; fi
          echo "无 >1MB 的非 lock 文件"
