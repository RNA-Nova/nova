<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🐍 贪吃蛇</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0f0f1a;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Segoe UI', 'PingFang SC', sans-serif;
    overflow: hidden;
    touch-action: none;
  }

  .game-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    max-width: 420px;
    padding: 0 4px;
  }

  .title {
    color: #4ade80;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 1px;
  }

  .score-panel {
    display: flex;
    gap: 16px;
  }

  .score-item {
    background: #1a1a2e;
    border: 1px solid #2a2a4a;
    border-radius: 10px;
    padding: 8px 16px;
    text-align: center;
  }

  .score-label {
    color: #8888aa;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .score-value {
    color: #fff;
    font-size: 22px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  .score-value.best {
    color: #facc15;
  }

  #canvas {
    border: 2px solid #2a2a4a;
    border-radius: 12px;
    background: #12121f;
    display: block;
  }

  .game-over-overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.65);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 10;
  }

  .game-over-overlay.hidden {
    display: none;
  }

  .game-over-card {
    background: #1a1a2e;
    border: 1px solid #3a3a5a;
    border-radius: 16px;
    padding: 32px 40px;
    text-align: center;
    animation: popIn 0.3s ease-out;
  }

  @keyframes popIn {
    from { transform: scale(0.8); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .game-over-card h2 {
    color: #f87171;
    font-size: 28px;
    margin-bottom: 12px;
  }

  .game-over-card .final-score {
    color: #facc15;
    font-size: 48px;
    font-weight: 700;
    margin-bottom: 8px;
  }

  .game-over-card .sub {
    color: #8888aa;
    font-size: 14px;
    margin-bottom: 24px;
  }

  .btn {
    background: #4ade80;
    color: #0f0f1a;
    border: none;
    border-radius: 10px;
    padding: 12px 32px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.5px;
  }

  .btn:hover {
    background: #6aee9a;
    transform: translateY(-1px);
  }
  .btn:active {
    transform: scale(0.96);
  }

  .hint {
    color: #555;
    font-size: 12px;
    margin-top: 4px;
  }
</style>
</head>
<body>

<div class="game-wrapper">
  <div class="header">
    <span class="title">🐍 贪吃蛇</span>
    <div class="score-panel">
      <div class="score-item">
        <div class="score-label">得分</div>
        <div class="score-value" id="score">0</div>
      </div>
      <div class="score-item">
        <div class="score-label">最佳</div>
        <div class="score-value best" id="best">0</div>
      </div>
    </div>
  </div>
  <canvas id="canvas"></canvas>
  <div class="hint">方向键 / WASD 控制 · 空格暂停</div>
</div>

<div class="game-over-overlay hidden" id="overlay">
  <div class="game-over-card">
    <h2>游戏结束</h2>
    <div class="final-score" id="finalScore">0</div>
    <div class="sub">分</div>
    <button class="btn" id="restartBtn">🔄 再来一局</button>
  </div>
</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

// 自适应尺寸
const CELL = 20;
const COLS = 20;
const ROWS = 20;
const W = COLS * CELL;
const H = ROWS * CELL;

canvas.width = W;
canvas.height = H;
canvas.style.width = Math.min(W, window.innerWidth - 16) + "px";
canvas.style.height = Math.min(H, window.innerHeight - 200) + "px";

// DOM 元素
const scoreEl = document.getElementById("score");
const bestEl = document.getElementById("best");
const finalScoreEl = document.getElementById("finalScore");
const overlay = document.getElementById("overlay");
const restartBtn = document.getElementById("restartBtn");

// 游戏状态
let snake, food, direction, nextDirection, score, bestScore, gameLoop, running, paused, speed;
let particles = [];

// 音效模拟 - 简单的粒子特效
function spawnParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1 + Math.random() * 3;
    particles.push({
      x: x * CELL + CELL / 2,
      y: y * CELL + CELL / 2,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1,
      decay: 0.02 + Math.random() * 0.04,
      color,
      size: 1.5 + Math.random() * 2.5,
    });
  }
}

function updateParticles() {
  particles = particles.filter(p => p.life > 0);
  for (const p of particles) {
    p.x += p.vx;
    p.y += p.vy;
    p.life -= p.decay;
  }
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// 加载最佳成绩
bestScore = parseInt(localStorage.getItem("snakeBest") || "0", 10);
bestEl.textContent = bestScore;

function randomFood() {
  while (true) {
    const fx = Math.floor(Math.random() * COLS);
    const fy = Math.floor(Math.random() * ROWS);
    if (!snake.some(s => s.x === fx && s.y === fy)) {
      return { x: fx, y: fy };
    }
  }
}

function init() {
  const midX = Math.floor(COLS / 2);
  const midY = Math.floor(ROWS / 2);
  snake = [
    { x: midX, y: midY },
    { x: midX - 1, y: midY },
    { x: midX - 2, y: midY },
  ];
  direction = { x: 1, y: 0 };
  nextDirection = { x: 1, y: 0 };
  score = 0;
  speed = 100;
  paused = false;
  particles = [];
  food = randomFood();
  scoreEl.textContent = "0";
  overlay.classList.add("hidden");
}

const DIR_MAP = {
  ArrowUp:    { x: 0, y: -1 },
  ArrowDown:  { x: 0, y: 1 },
  ArrowLeft:  { x: -1, y: 0 },
  ArrowRight: { x: 1, y: 0 },
  w: { x: 0, y: -1 }, W: { x: 0, y: -1 },
  s: { x: 0, y: 1 },  S: { x: 0, y: 1 },
  a: { x: -1, y: 0 }, A: { x: -1, y: 0 },
  d: { x: 1, y: 0 },  D: { x: 1, y: 0 },
};

document.addEventListener("keydown", (e) => {
  const dir = DIR_MAP[e.key];
  if (dir) {
    e.preventDefault();
    // 不允许反向
    if (dir.x !== -direction.x || dir.y !== -direction.y) {
      nextDirection = dir;
    }
  }
  if (e.key === " " || e.key === "Escape") {
    e.preventDefault();
    togglePause();
  }
  if (e.key === "Enter" && !running) {
    restart();
  }
});

// 触摸支持
let touchStartX = 0, touchStartY = 0;
canvas.addEventListener("touchstart", (e) => {
  e.preventDefault();
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, { passive: false });

canvas.addEventListener("touchend", (e) => {
  e.preventDefault();
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  const absDx = Math.abs(dx);
  const absDy = Math.abs(dy);

  if (Math.max(absDx, absDy) < 20) return; // 太小忽略

  let dir;
  if (absDx > absDy) {
    dir = dx > 0 ? { x: 1, y: 0 } : { x: -1, y: 0 };
  } else {
    dir = dy > 0 ? { x: 0, y: 1 } : { x: 0, y: -1 };
  }

  if (dir.x !== -direction.x || dir.y !== -direction.y) {
    nextDirection = dir;
  }
}, { passive: false });

restartBtn.addEventListener("click", restart);

function togglePause() {
  if (!running) return;
  paused = !paused;
  draw(); // 刷新画面显示暂停状态
}

function restart() {
  clearTimeout(gameLoop);
  init();
  running = true;
  tick();
}

function gameOver() {
  running = false;
  clearTimeout(gameLoop);
  if (score > bestScore) {
    bestScore = score;
    localStorage.setItem("snakeBest", bestScore);
    bestEl.textContent = bestScore;
  }
  finalScoreEl.textContent = score;
  overlay.classList.remove("hidden");
  // 死亡粒子
  const head = snake[0];
  spawnParticles(head.x, head.y, "#f87171", 30);
  draw();
}

function tick() {
  if (!running) return;
  if (paused) {
    gameLoop = setTimeout(tick, speed);
    return;
  }

  direction = nextDirection;
  const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };

  // 撞墙
  if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
    gameOver();
    return;
  }

  // 撞自己
  if (snake.some(s => s.x === head.x && s.y === head.y)) {
    gameOver();
    return;
  }

  snake.unshift(head);

  // 吃食物
  if (head.x === food.x && head.y === food.y) {
    score += 10;
    scoreEl.textContent = score;
    spawnParticles(food.x, food.y, "#facc15", 12);
    food = randomFood();
    // 加速
    if (speed > 45) speed -= 1;
  } else {
    snake.pop();
  }

  updateParticles();
  draw();
  gameLoop = setTimeout(tick, speed);
}

// ---- 绘制 ----

function drawGrid() {
  ctx.strokeStyle = "rgba(255,255,255,0.03)";
  ctx.lineWidth = 0.5;
  for (let x = 0; x <= COLS; x++) {
    ctx.beginPath();
    ctx.moveTo(x * CELL, 0);
    ctx.lineTo(x * CELL, H);
    ctx.stroke();
  }
  for (let y = 0; y <= ROWS; y++) {
    ctx.beginPath();
    ctx.moveTo(0, y * CELL);
    ctx.lineTo(W, y * CELL);
    ctx.stroke();
  }
}

function drawCell(x, y, color, radius = 4) {
  const px = x * CELL + 1;
  const py = y * CELL + 1;
  const s = CELL - 2;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.roundRect(px, py, s, s, radius);
  ctx.fill();
}

function drawSnake() {
  const len = snake.length;
  snake.forEach((seg, i) => {
    const t = i / Math.max(len - 1, 1);
    // 头部亮绿 → 尾部暗绿
    const r = Math.floor(34 + t * 20);
    const g = Math.floor(200 - t * 80);
    const b = Math.floor(80 - t * 40);
    const alpha = 1 - t * 0.35;

    ctx.globalAlpha = alpha;
    const radius = i === 0 ? 6 : 4;
    drawCell(seg.x, seg.y, `rgb(${r},${g},${b})`, radius);

    // 头部眼睛
    if (i === 0) {
      ctx.globalAlpha = 1;
      const cx = seg.x * CELL + CELL / 2;
      const cy = seg.y * CELL + CELL / 2;
      const eyeOff = 4;
      let ex1, ey1, ex2, ey2;
      if (direction.x === 1) {
        ex1 = cx + 4; ey1 = cy - eyeOff;
        ex2 = cx + 4; ey2 = cy + eyeOff;
      } else if (direction.x === -1) {
        ex1 = cx - 4; ey1 = cy - eyeOff;
        ex2 = cx - 4; ey2 = cy + eyeOff;
      } else if (direction.y === -1) {
        ex1 = cx - eyeOff; ey1 = cy - 4;
        ex2 = cx + eyeOff; ey2 = cy - 4;
      } else {
        ex1 = cx - eyeOff; ey1 = cy + 4;
        ex2 = cx + eyeOff; ey2 = cy + 4;
      }
      ctx.fillStyle = "#fff";
      ctx.beginPath();
      ctx.arc(ex1, ey1, 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(ex2, ey2, 3, 0, Math.PI * 2);
      ctx.fill();
      // 瞳孔
      ctx.fillStyle = "#111";
      ctx.beginPath();
      ctx.arc(ex1 + direction.x * 1.2, ey1 + direction.y * 1.2, 1.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(ex2 + direction.x * 1.2, ey2 + direction.y * 1.2, 1.5, 0, Math.PI * 2);
      ctx.fill();
    }
  });
  ctx.globalAlpha = 1;
}

function drawFood() {
  const cx = food.x * CELL + CELL / 2;
  const cy = food.y * CELL + CELL / 2;
  const pulse = 1 + Math.sin(Date.now() / 200) * 0.15;

  // 光晕
  ctx.fillStyle = "rgba(248,113,113,0.25)";
  ctx.beginPath();
  ctx.arc(cx, cy, CELL * 0.45 * pulse, 0, Math.PI * 2);
  ctx.fill();

  // 食物主体
  const gradient = ctx.createRadialGradient(cx - 1, cy - 1, 0, cx, cy, CELL * 0.42);
  gradient.addColorStop(0, "#ff6b6b");
  gradient.addColorStop(1, "#c0392b");
  ctx.fillStyle = gradient;
  ctx.beginPath();
  ctx.arc(cx, cy, CELL * 0.38, 0, Math.PI * 2);
  ctx.fill();

  // 高光
  ctx.fillStyle = "rgba(255,255,255,0.5)";
  ctx.beginPath();
  ctx.arc(cx - 2.5, cy - 2.5, 2.5, 0, Math.PI * 2);
  ctx.fill();
}

function drawPaused() {
  ctx.fillStyle = "rgba(0,0,0,0.55)";
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "#fff";
  ctx.font = "bold 28px 'PingFang SC','Segoe UI',sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("⏸ 暂停中", W / 2, H / 2 - 4);
  ctx.font = "14px 'PingFang SC','Segoe UI',sans-serif";
  ctx.fillStyle = "#888";
  ctx.fillText("按空格继续", W / 2, H / 2 + 24);
  ctx.textAlign = "start";
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  drawGrid();
  drawFood();
  drawSnake();
  drawParticles();

  if (paused) drawPaused();

  // 持续渲染食物动画（仅在运行且非暂停时）
  if (running && !paused) {
    // 食物的 pulse 动画需要持续刷新，draw 本身在 tick 里调用
  }
}

// 启动
init();
running = true;
tick();
</script>
</body>
</html>
