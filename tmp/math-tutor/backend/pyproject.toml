[project]
name = "math-tutor"
version = "0.1.0"
description = "基于 nova_ai 与 nova_agent 的数学教学智能体"
authors = [{ name = "Liujinming" }]
license = { text = "MIT" }
requires-python = ">=3.12,<3.14"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/math_tutor"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "win-64"]

[tool.pixi.dependencies]
python = ">=3.12,<3.14"

[tool.pixi.pypi-dependencies]
nova-ai = { path = "../../../packages/nova_ai", editable = true }
nova-agent = { path = "../../../packages/nova_agent", editable = true }
fastapi = ">=0.115.0"
uvicorn = { version = ">=0.32.0", extras = ["standard"] }
pydantic = ">=2.0"
python-dotenv = ">=1.0.0"

[tool.pixi.feature.dev.pypi-dependencies]
pytest = ">=7.4.0"
pytest-asyncio = ">=0.21.0"
black = ">=23.10.1"
isort = ">=5.12.0"

[tool.pixi.environments]
default = { features = [], solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[tool.pixi.tasks]
start = { cmd = "uvicorn math_tutor.main:app --host 0.0.0.0 --port 8000 --reload", cwd = "backend", env = { PYTHONPATH = "src" } }
serve = { cmd = "python -m math_tutor.main", cwd = "backend", env = { PYTHONPATH = "src" } }

[tool.black]
target-version = ['py312']

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
